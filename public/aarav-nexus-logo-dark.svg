<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 130" fill="none">
  <!-- Aarav Nexus Stylized 'A' Geometric Icon -->
  <g transform="translate(85, 4)">
    <!-- Top White Apex Beam -->
    <polygon points="36,0 55,0 75,38 56,38" fill="#FFFFFF" />
    <!-- Left White Diagonal Beam -->
    <polygon points="6,66 25,66 45,26 26,26" fill="#FFFFFF" />
    <!-- Central Teal Circle -->
    <circle cx="55" cy="46" r="9" fill="#00D2E6" />
    <!-- Lower Right Teal Beam -->
    <polygon points="76,50 95,50 109,76 90,76" fill="#00D2E6" />
  </g>

  <!-- Wordmark 'AARAV NEXUS' in Crisp White -->
  <text x="140" y="105" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF" letter-spacing="3.5">AARAV NEXUS</text>

  <!-- Teal Accent Underline -->
  <rect x="122" y="117" width="36" height="3" rx="1.5" fill="#00D2E6" />
</svg>
