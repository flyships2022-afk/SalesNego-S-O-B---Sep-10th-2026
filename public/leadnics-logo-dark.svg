<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <!-- Leadnics Connected Network Icon -->
  <g>
    <!-- Orange "N" Network Line -->
    <path d="M16 62 V22 L56 62 V22" stroke="#FF7300" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Orange Terminal Node Circles -->
    <circle cx="16" cy="62" r="7" fill="#FF7300" />
    <circle cx="56" cy="22" r="7" fill="#FF7300" />

    <!-- Blue Vertical Line -->
    <line x1="36" y1="12" x2="36" y2="72" stroke="#3B82F6" stroke-width="4.5" stroke-linecap="round" />
    <!-- Blue Vertical Node Circles -->
    <circle cx="36" cy="12" r="7" fill="#3B82F6" />
    <circle cx="36" cy="72" r="7" fill="#3B82F6" />
  </g>

  <!-- Leadnics Wordmark in Crisp White -->
  <text x="82" y="57" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="600" fill="#FFFFFF" letter-spacing="-0.5">Leadnics</text>
</svg>
